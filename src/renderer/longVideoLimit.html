<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <title>Long-video limit</title>
    <link rel="stylesheet" href="manualSearch.css" />
    <style>
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin-bottom: 14px;
        color: inherit;
      }
      .checkbox-row input {
        margin: 0;
      }
      input[type='number'] {
        width: 120px;
      }
      input:disabled,
      label.disabled {
        opacity: 0.45;
      }
      #save-btn {
        background: #6c5ce7;
        border-color: #6c5ce7;
      }
      #save-btn:hover {
        background: #5849c4;
      }
    </style>
  </head>
  <body>
    <h1>Long-video limit for AI lyrics</h1>
    <p class="hint">
      When no lyrics site has a song, the AI fallback is asked to listen to the
      video itself. For long videos (episodes, streams, podcasts) that usually
      produces made-up lyrics, so videos longer than this limit are treated as
      "not music" instead.
    </p>
    <label class="checkbox-row" for="enabled-input">
      <input type="checkbox" id="enabled-input" />
      Skip AI lyrics for long videos
    </label>
    <label for="minutes-input" id="minutes-label">Limit (minutes)</label>
    <input type="number" id="minutes-input" step="1" />
    <p id="status" class="status">Press Enter to save.</p>
    <div class="actions">
      <button id="cancel-btn">Cancel</button>
      <button id="save-btn">Save</button>
    </div>
    <script src="longVideoLimit.js"></script>
  </body>
</html>
